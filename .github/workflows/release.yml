name: Verify and prepare a draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.21.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require the tag to match the source version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'const Version = "([^"]+)"', Path('types.go').read_text())[1]
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match the source version')
          PY
      - name: Native regression and race tests
        run: go test -buildvcs=false -race -timeout=300s ./...
      - name: Static checks
        run: go vet -buildvcs=false ./...
      - name: Build and verify native installable artifacts
        run: python3 release.py --output dist --skip-tests --repository "${{ github.repository }}"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: verified-release
          path: |
            dist/release-assets/*
            dist/buildheadway.zip
            dist/*.tgz
          if-no-files-found: error
  draft-release:
    needs: native-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-release
          path: dist
      - name: Create a reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('release-notes.md').write_text('Terminal coding agent release.\n\nNative tests and installation checks passed on Linux, Windows and macOS in this workflow. ARM64 targets are cross-compiled unless the corresponding runner executed them.\n\nSee docs/install.md and VALIDATION.md in the bundle. Review this draft before publishing; npm publication is separate.\n')
          PY
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md dist/release-assets/* dist/buildheadway.zip dist/*.tgz
